<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abora</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23101418'/><rect x='20' y='30' width='60' height='40' rx='4' fill='%23f4f4f2'/><rect x='42' y='30' width='16' height='22' rx='2' fill='%2316181b'/><rect x='20' y='48' width='60' height='3' fill='%234c9aff'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="head-title">
      <h1>Abora</h1>
      <button id="reset-btn" class="reset-btn" type="button"
        title="Close ALL monitor/aseqdump instances and restart the server (use when the site is frozen or shows stale online status)">reset server</button>
      <span class="badge">walled garden &middot; 127.0.0.1:5050</span>
    </div>
    <div id="status" class="status offline">keyboard offline</div>
    <div id="instrument" class="instrument">instrument: &mdash;</div>
  </header>

  <div id="capture-error" class="capture-error" role="alert"></div>

  <div class="main-grid">
    <!-- Left column: note stream (top half) + raw midi buffer (bottom half) -->
    <div class="left-col">
      <aside id="feed-sidebar" class="feed-sidebar card">
        <div class="feed-header">
          <span class="feed-label">note stream</span>
          <button id="feed-clear" class="key-reset" type="button" title="Clear note stream">clear</button>
        </div>
        <ul id="feed-list" class="feed-list"></ul>
      </aside>

      <!-- Raw midi buffer: the source buffer. Record/stop, playback and the
           single clear control all live here (notation is derived from it). -->
      <aside id="raw-sidebar" class="raw-sidebar card">
        <div class="raw-take-head">
          <span class="raw-take-title">raw midi buffer</span>
          <button id="raw-take-clear" class="key-reset" type="button"
                  title="Clear the raw buffer and the notation derived from it">clear</button>
        </div>
        <div class="raw-take-controls">
          <button id="record-btn" class="record-btn" type="button"
                  title="REC: start a new take (clears the buffer). STOP: freeze the take and flush the last note.">
            <span id="record-btn-dot" class="record-dot"></span><span id="record-btn-label">rec</span>
          </button>
        </div>
        <ul id="raw-take" class="feed-list raw-take"></ul>
      </aside>
    </div>

    <!-- Right main area -->
    <main id="main-area" class="main-area">
      <section id="piano-wrap" class="card">
        <div id="piano"></div>
      </section>

      <div class="control-row">
        <!-- tempo & meter: quantization tempo, metronome, time signature -->
        <section id="tempo-card" class="tempo-card card">
          <div class="keysec-head">
            <span class="keysec-title">tempo &amp; meter</span>
          </div>
          <div class="tempo-card-body">
            <div class="tempo-row">
              <span>tempo:</span>
              <input type="number" id="tempo-input" class="tempo-input" min="30" max="300" step="1"
                     placeholder="auto" title="Set a fixed tempo (BPM) to lock quantization; blank = auto-detect">
              <span id="tempo-tag" class="tempo-tag">auto</span>
              <span id="tempo-detected" class="tempo-detected"></span>
            </div>
            <div class="tempo-row">
              <button id="metronome-btn" class="metro-btn" type="button" title="Click at the tempo">&#9835; metronome</button>
              <span id="metro-beat" class="metro-beat" aria-hidden="true"></span>
              <label class="timesig-label"><span>time:</span>
                <select id="timesig" title="Set the time signature (beats per measure)">
                  <option value="2/4">2/4</option>
                  <option value="3/4">3/4</option>
                  <option value="4/4" selected>4/4</option>
                  <option value="5/4">5/4</option>
                  <option value="6/8">6/8</option>
                  <option value="7/8">7/8</option>
                  <option value="9/8">9/8</option>
                  <option value="12/8">12/8</option>
                </select>
</label>
            <label class="humanizer-label"><span>humanize:</span>
              <input type="checkbox" id="humanizer-enabled" checked title="Add subtle timing/velocity variations to the keyboard output">
              <label for="humanizer-enabled">humanize</label>
              <input type="number" id="humanizer-timing" class="humanizer-input" min="0" max="100" step="1"
                     value="10" title="Max random timing shift in milliseconds (±)">
              <label for="humanizer-timing">ms</label>
              <input type="number" id="humanizer-velocity" class="humanizer-input" min="0" max="20" step="1"
                     value="5" title="Max random velocity shift (±) ">
              <label for="humanizer-velocity">vel</label>
            </label>
          </div>
        </section>

        <section id="key" class="keysec card">
          <div class="keysec-head">
            <span class="keysec-title">tonic &amp; scale</span>
            <button id="catch-help" class="help-btn" type="button"
                    title="How the catch button turns a played chord into a scale">?</button>
          </div>
        <div class="keysec-controls">
          <label>
            <span>tonic:</span>
            <select id="key-tonic">
              <option value="-1">— off —</option>
              <option value="0">C</option>
              <option value="1">C# / Db</option>
              <option value="2">D</option>
              <option value="3">D# / Eb</option>
              <option value="4">E</option>
              <option value="5">F</option>
              <option value="6">F# / Gb</option>
              <option value="7">G</option>
              <option value="8">G# / Ab</option>
              <option value="9">A</option>
              <option value="10">A# / Bb</option>
              <option value="11">B</option>
            </select>
          </label>
          <label>
            <span>scale:</span>
            <select id="key-scale">
              <option value="-1">— off —</option>
              <optgroup label="Diatonic modes">
                <option value="major">Major (Ionian)</option>
                <option value="dorian">Dorian</option>
                <option value="phrygian">Phrygian</option>
                <option value="lydian">Lydian</option>
                <option value="mixolydian">Mixolydian</option>
                <option value="aeolian">Natural Minor (Aeolian)</option>
                <option value="locrian">Locrian</option>
              </optgroup>
              <optgroup label="Minor & classical">
                <option value="harmonic_minor">Harmonic Minor</option>
                <option value="melodic_minor">Melodic Minor</option>
                <option value="harmonic_major">Harmonic Major</option>
                <option value="double_harmonic">Double Harmonic Major</option>
                <option value="phrygian_dominant">Phrygian Dominant</option>
                <option value="lydian_dominant">Lydian Dominant</option>
                <option value="super_locrian">Super Locrian (Altered)</option>
              </optgroup>
              <optgroup label="Pentatonic & blues">
                <option value="major_pent">Major Pentatonic</option>
                <option value="minor_pent">Minor Pentatonic</option>
                <option value="blues">Blues</option>
                <option value="hirajoshi">Hirajoshi</option>
              </optgroup>
              <optgroup label="Bebop">
                <option value="bebop_major">Bebop Major</option>
                <option value="bebop_dominant">Bebop Dominant</option>
                <option value="bebop_dorian">Bebop Dorian (Minor)</option>
              </optgroup>
              <optgroup label="Symmetric & exotic">
                <option value="whole_tone">Whole Tone</option>
                <option value="diminished">Diminished (whole-half)</option>
                <option value="chromatic">Chromatic</option>
                <option value="enigmatic">Enigmatic</option>
                <option value="hungarian_minor">Hungarian Minor</option>
                <option value="neapolitan_major">Neapolitan Major</option>
                <option value="neapolitan_minor">Neapolitan Minor</option>
              </optgroup>
            </select>
          </label>
          <button id="listen-tonic" class="listen-btn" type="button"
                  title="Wait for the next note you play and set the tonic to it">&#9834; catch</button>
        </div>
        </section>
      </div>

      <!-- Signal chain: raw midi -> transform (quantizer) -> out (keyboard).
           The transform re-hears the raw buffer under the current grid; OUT
           plays the transformed take back. -->
      <div class="chain-row">
        <section id="transform-card" class="chain-card card">
          <div class="chain-head">
            <span class="chain-title">transform &middot; quantizer</span>
            <span id="chain-counts" class="chain-counts" title="Raw events in -> transformed MIDI events out"></span>
          </div>
          <div class="chain-controls">
            <label class="quant-label"><span>quant:</span>
              <select id="quantization" title="Grid the quantizer snaps to, in explicit note values; off passes exact timing through">
                <option value="0">off (no quantization)</option>
                <option value="16">64th</option>
                <option value="8">32nd</option>
                <option value="4" selected>16th</option>
                <option value="2">8th</option>
                <option value="1">quarter</option>
                <option value="0.5">half</option>
                <option value="0.25">whole</option>
              </select>
            </label>
            <label class="transpose-label"><span>transpose:</span>
              <input type="number" id="transpose-input" class="tempo-input" min="-24" max="24" step="1"
                     value="0" title="Transpose the transformed take by semitones (-24..+24, 0 = off)">
            </label>
            <span id="chain-status" class="chain-status"></span>
            <label class="vel-label"><span>compressor:</span>
              <input type="checkbox" id="vel-enabled" checked title="Enable/disable the velocity compressor stage">
              <label for="vel-enabled">compress</label>
              <input type="number" id="vel-standard" class="vel-input" min="1" max="127" step="1"
                     value="100" title="Standard velocity (center of the target band); blank to auto-detect from the buffer">
              <button id="vel-auto" class="listen-btn" type="button"
                      title="Auto-detect standard velocity from the raw buffer (median of note-on velocities)">&#9889; detect</button>
            </label>
            <label class="vel-width-label"><span>width:</span>
              <input type="number" id="vel-width" class="vel-input" min="1" max="127" step="1"
                     value="50" title="Velocity band half-width (all velocities forced inside standard ± width/2)">
            </label>
            <label class="vel-mode-label"><span>mode:</span>
              <select id="vel-mode" title="Compressor mode">
                <option value="compress" selected>compress (linear rescale)</option>
                <option value="threshold">threshold (clip)</option>
              </select>
            </label>
            <label class="humanizer-label"><span>humanize:</span>
              <input type="checkbox" id="humanizer-enabled" title="Add subtle timing/velocity variations to the keyboard output">
              <label for="humanizer-enabled">humanize</label>
              <input type="number" id="humanizer-timing" class="humanizer-input" min="0" max="100" step="1"
                     value="10" title="Max random timing shift in milliseconds (±)">
              <label for="humanizer-timing">ms</label>
              <input type="number" id="humanizer-velocity" class="humanizer-input" min="0" max="20" step="1"
                     value="5" title="Max random velocity shift (±)">
              <label for="humanizer-velocity">vel</label>
            </label>
          </div>
        </section>

        <section id="out-card" class="chain-card card">
          <div class="chain-head">
            <span class="chain-title">out &middot; keyboard</span>
          </div>
          <div class="chain-controls">
            <div class="replay-btn-group">
              <button id="replay-btn" class="record-btn replay-btn" type="button"
                      title="Play the transformed take back through the keyboard's internal voices. Click again to stop.">
                <span id="replay-btn-glyph" class="replay-glyph">&#9656;</span><span id="replay-btn-label">play take</span>
              </button>
              <button id="replay-stop-btn" class="record-btn stop-btn" type="button"
                      title="Halt playback immediately and cut all notes">
                <span id="replay-stop-glyph">&#9646;</span><span id="replay-stop-label">stop</span>
              </button>
              <button id="replay-loop-btn" class="record-btn loop-btn" type="button"
                      title="Loop the pattern until STOP is clicked">
                <span id="replay-loop-glyph">&#9851;</span><span id="replay-loop-label">loop</span>
              </button>
            </div>
            <label class="replay-voice-label">
              <span>voice:</span>
              <select id="replay-voice" title="Voice to use for playback (sends program change before replay; 'auto' uses current receive voice)">
                <option value="auto">auto (current receive voice)</option>
                <option value="Grand Piano">Grand Piano</option>
                <option value="Electric Piano 1">Electric Piano 1</option>
                <option value="Electric Piano 2">Electric Piano 2</option>
                <option value="Electric Grand Piano">Electric Grand Piano</option>
                <option value="Drawbar Organ">Drawbar Organ</option>
                <option value="Rock Organ">Rock Organ</option>
                <option value="Accordion">Accordion</option>
                <option value="Harmonica">Harmonica</option>
                <option value="Nylon Guitar">Nylon Guitar</option>
                <option value="Steel Guitar">Steel Guitar</option>
                <option value="Jazz Guitar">Jazz Guitar</option>
                <option value="Clean Guitar">Clean Guitar</option>
                <option value="Overdriven Guitar">Overdriven Guitar</option>
                <option value="Acoustic Bass">Acoustic Bass</option>
                <option value="Finger Bass">Finger Bass</option>
                <option value="Slap Bass">Slap Bass</option>
                <option value="Synth Bass">Synth Bass</option>
                <option value="Strings">Strings</option>
                <option value="Pizzicato Strings">Pizzicato Strings</option>
                <option value="Violin">Violin</option>
                <option value="Cello">Cello</option>
                <option value="Orchestral Harp">Orchestral Harp</option>
                <option value="Oboe">Oboe</option>
                <option value="Clarinet">Clarinet</option>
                <option value="Flute">Flute</option>
                <option value="Tenor Sax">Tenor Sax</option>
                <option value="Brass Section">Brass Section</option>
                <option value="Trumpet">Trumpet</option>
                <option value="Trombone">Trombone</option>
                <option value="French Horn">French Horn</option>
                <option value="Synth Brass">Synth Brass</option>
                <option value="Gemini">Gemini</option>
                <option value="Punchy Chordz">Punchy Chordz</option>
                <option value="Square Lead">Square Lead</option>
                <option value="Sawtooth Lead">Sawtooth Lead</option>
                <option value="New Age Pad">New Age Pad</option>
                <option value="Warm Pad">Warm Pad</option>
                <option value="Brightness">Brightness</option>
                <option value="Standard Kit">Standard Kit</option>
                <option value="Dance Kit">Dance Kit</option>
                <option value="Vibraphone">Vibraphone</option>
                <option value="Marimba">Marimba</option>
              </select>
            </label>
          </div>
        </section>
      </div>

      <section id="stave-wrap" class="stave-wrap card">
        <div class="stave-head">
          <span class="stave-title">notation</span>
          <div class="stave-controls">
            <label><input type="checkbox" id="show-intervals"> intervals</label>
          </div>
        </div>
        <div id="stave" class="stave"></div>
      </section>

      <div class="mini-row">
        <section id="mini-stave-wrap" class="mini-stave-wrap card">
          <div class="mini-stave-head">
            <span class="mini-stave-title">last chord / interval</span>
          </div>
          <div id="flash" class="flash"></div>
          <div id="mini-stave" class="mini-stave"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="catch-tooltip" class="catch-tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="{{ url_for('static', filename='vendor/vexflow.js') }}"></script>
  <script src="{{ url_for('static', filename='stave.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
